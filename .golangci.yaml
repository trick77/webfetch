version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    staticcheck:
      # ST1005 (error strings not capitalized) is off here: this package
      # reproduces upstream mcp-server-fetch's error strings verbatim as part of
      # its documented observable contract (see the package doc in webfetch.go).
      checks:
        - all
        - -ST1005
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: error-return
        - name: error-strings
        - name: context-as-argument
        - name: unused-parameter
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
